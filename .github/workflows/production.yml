# Al subir un tag vX.Y.Z (creado a mano sobre main, después de probar la versión en staging):
# despliegue en producción. Es el paso manual: nadie despliega en producción sin crear el tag.
name: Producción

on:
  push:
    tags: ['v*']

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Un tag puede apuntar a cualquier commit: solo se despliega si ese commit está en main.
  check-tag:
    name: Comprobar que el tag está en main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El tag ${GITHUB_REF_NAME} no apunta a un commit de main."
            exit 1
          fi

  ci:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Desplegar en producción
    needs: ci
    runs-on: ubuntu-latest
    # El entorno "production" puede exigir aprobación manual (Settings → Environments).
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      # Token de proyecto de Railway: solo puede desplegar en este entorno.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @railway/cli@5
      - run: railway up --ci --service "${{ vars.RAILWAY_SERVICE }}" --environment production

  smoke:
    name: Comprobar /health
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: curl --fail --retry 10 --retry-delay 6 --retry-all-errors "${{ vars.APP_URL }}/health"
