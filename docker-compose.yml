# Entorno local completo: API + PostgreSQL.
#   docker compose up --build
# Las variables se leen de .env (copia .env.example y rellena JWT_SECRET).

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/ficheros
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-10485760}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ficheros
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin "ports": la base de datos solo es accesible desde la API, no desde fuera.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ficheros"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  uploads:
  pgdata:
